<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llmwatch · senha</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1e3a8a">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-alt: #f0f2f5;
    --border: #dfe3e8;
    --text: #1c2128;
    --muted: #636c76;
    --accent: #2f6feb;
    --accent-soft: #dbe7ff;
    --ok: #1a7f4b;
    --warn: #b26a00;
    --bad: #c0392b;
    --grid: #eceff3;
    --shadow: 0 1px 2px rgba(16, 22, 26, 0.06), 0 4px 12px rgba(16, 22, 26, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --panel-alt: #1c232c;
      --border: #2b333d;
      --text: #e6edf3;
      --muted: #9198a1;
      --accent: #58a6ff;
      --accent-soft: #1d2b45;
      --ok: #3fb950;
      --warn: #d29922;
      --bad: #f85149;
      --grid: #262d36;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.3);
    }
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  ::-webkit-scrollbar-track { background: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, sans-serif;
    -webkit-text-size-adjust: 100%;
    display: grid;
    place-items: center;
    padding: 20px 16px;
  }
  .card {
    width: min(380px, 100%);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    box-shadow: var(--shadow);
  }
  h1 { margin: 0 0 22px; font-size: 24px; font-weight: 650; letter-spacing: -0.02em; text-align: center; }
  label { display: block; margin-bottom: 7px; font-weight: 600; }
  input {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field { margin-bottom: 15px; }
  button {
    width: 100%;
    margin-top: 16px;
    font: inherit;
    font-weight: 650;
    color: #ffffff;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { filter: brightness(0.96); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .error { min-height: 22px; margin-top: 12px; color: var(--bad); font-size: 13px; }
  .success { color: var(--ok); }
  .banner { margin-bottom: 18px; padding: 11px 12px; border: 1px solid var(--warn); border-radius: 8px; color: var(--warn); background: var(--panel-alt); }
  .checklist { margin: 5px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 12.5px; }
  .checklist li { padding: 2px 0; }
  .checklist li.ok { color: var(--ok); }
  .checklist li.bad { color: var(--bad); }
  footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border); }
  a, .link-button { color: var(--accent); text-decoration: none; font-weight: 600; }
  a:hover, .link-button:hover { text-decoration: underline; }
  .link-button { border: 0; background: transparent; padding: 0; margin: 0; width: auto; font: inherit; cursor: pointer; }
  .credit {
    display: block;
    margin-top: 16px;
    padding-top: 0;
    border-top: none;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  .credit a { color: inherit; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main class="card">
    <h1>llmwatch</h1>
    <div id="banner" class="banner" role="alert" hidden>Por segurança, troque a senha gerada na instalação.</div>
    <form id="password-form">
      <div class="field">
        <label for="current">Senha atual</label>
        <input id="current" name="current" type="password" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="next">Nova senha</label>
        <input id="next" name="next" type="password" autocomplete="new-password" minlength="12" required>
      </div>
      <div class="field">
        <label for="confirm">Confirmar nova senha</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
      </div>
      <ul id="checklist" class="checklist" aria-live="polite"></ul>
      <button id="submit" type="submit" disabled>Salvar senha</button>
      <div id="error" class="error" role="alert" aria-live="polite"></div>
    </form>
    <footer>
      <a id="back" href="/">Voltar ao painel</a>
      <button id="logout" class="link-button" type="button">Sair</button>
    </footer>
    <footer class="credit">desenvolvido por <a href="https://github.com/fthiago01" target="_blank" rel="noopener noreferrer">fthiago01</a></footer>
  </main>
<script>
(function () {
  "use strict";
  const form = document.getElementById("password-form");
  const currentInput = document.getElementById("current");
  const nextInput = document.getElementById("next");
  const confirmInput = document.getElementById("confirm");
  const checklist = document.getElementById("checklist");
  const submitButton = document.getElementById("submit");
  const errorBox = document.getElementById("error");
  const banner = document.getElementById("banner");
  const backLink = document.getElementById("back");
  const logoutButton = document.getElementById("logout");
  const rules = [];

  function addRule(label, test) {
    const item = document.createElement("li");
    const marker = document.createElement("span");
    marker.setAttribute("aria-hidden", "true");
    marker.textContent = "✗ ";
    const text = document.createElement("span");
    text.textContent = label;
    item.appendChild(marker);
    item.appendChild(text);
    checklist.appendChild(item);
    rules.push({ test: test, item: item, marker: marker });
  }

  addRule("Mínimo de 12 caracteres", function (value) { return value.length >= 12; });
  addRule("Contém uma letra", function (value) { return /[A-Za-z]/.test(value); });
  addRule("Contém um número", function (value) { return /[0-9]/.test(value); });
  addRule("Confirmação igual à nova senha", function (value, confirm) { return value === confirm; });
  addRule("Diferente da senha atual", function (value, current) { return value !== current; });

  function refresh() {
    const checks = [
      nextInput.value.length >= 12,
      /[A-Za-z]/.test(nextInput.value),
      /[0-9]/.test(nextInput.value),
      nextInput.value === confirmInput.value,
      nextInput.value !== currentInput.value
    ];
    let allOk = true;
    rules.forEach(function (rule, index) {
      const ok = checks[index];
      rule.item.classList.toggle("ok", ok);
      rule.item.classList.toggle("bad", !ok);
      rule.marker.textContent = ok ? "✓ " : "✗ ";
      allOk = allOk && ok;
    });
    submitButton.disabled = !allOk;
  }
  currentInput.addEventListener("input", refresh);
  nextInput.addEventListener("input", refresh);
  confirmInput.addEventListener("input", refresh);

  fetch("/api/me", { credentials: "same-origin" })
    .then(function (response) {
      if (response.status === 401) {
        window.location.assign("/login?next=/password");
        return null;
      }
      if (!response.ok) throw new Error("Falha ao carregar o perfil");
      return response.json();
    })
    .then(function (data) {
      if (!data) return;
      if (data.must_change_password) {
        banner.hidden = false;
        backLink.hidden = true;
      }
    })
    .catch(function () {
      errorBox.textContent = "Não foi possível carregar a sessão.";
    });

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    errorBox.textContent = "";
    submitButton.disabled = true;
    try {
      const response = await fetch("/api/password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ current: currentInput.value, next: nextInput.value })
      });
      if (response.status === 204) {
        errorBox.classList.add("success");
        errorBox.textContent = "Senha alterada com sucesso.";
        window.setTimeout(function () { window.location.assign("/"); }, 1000);
        return;
      }
      let message = "Não foi possível alterar a senha.";
      try {
        const data = await response.json();
        if (data && typeof data.error === "string" && data.error) message = data.error;
      } catch (ignore) {}
      errorBox.textContent = message;
      refresh();
    } catch (error) {
      errorBox.textContent = "Não foi possível conectar ao servidor.";
      refresh();
    }
  });

  logoutButton.addEventListener("click", async function () {
    try {
      await fetch("/api/logout", { method: "POST", credentials: "same-origin" });
    } catch (ignore) {}
    window.location.assign("/login");
  });
}());
</script>
</body>
</html>
